<!-- @dsCard group="AI" viewport="900x450" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>AI chat tool bar - V27</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  .ds-pane { padding:24px; background:var(--v27-background-primary); color:var(--v27-foreground-primary); }
  .ds-head { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--v27-foreground-secondary); margin:0 0 4px; }
  .ds-meta { font-size:12px; color:var(--v27-foreground-secondary); margin:0 0 18px; }
  .ds-story { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin:0 0 18px; }
  .ds-split { display:grid; grid-template-columns:1fr 1fr; }
</style>
</head>
<body>
<div class="ds-split">
  <div class="ds-pane">
    <p class="ds-head">AI chat tool bar - light</p>
    <p class="ds-meta">Figma 1997:40096 &middot; 2 classes</p>
      <div class="ds-story">
        <div class="v27-ai-toolbar">
          <button type="button" class="v27-ai-toolbar__action" aria-label="Copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
          <button type="button" class="v27-ai-toolbar__action" aria-label="Unhelpful">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
          <button type="button" class="v27-ai-toolbar__action" aria-label="Save">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
          <button type="button" class="v27-ai-toolbar__action" aria-label="Show sources">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
        </div>
      </div>
  </div>
  <div class="ds-pane" data-v27-theme="dark">
    <p class="ds-head">dark</p>
    <p class="ds-meta">&nbsp;</p>
      <div class="ds-story">
        <div class="v27-ai-toolbar">
          <button type="button" class="v27-ai-toolbar__action" aria-label="Copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
          <button type="button" class="v27-ai-toolbar__action" aria-label="Unhelpful">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
          <button type="button" class="v27-ai-toolbar__action" aria-label="Save">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
          <button type="button" class="v27-ai-toolbar__action" aria-label="Show sources">
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
          </button>
        </div>
      </div>
  </div>
</div>
</body></html>
