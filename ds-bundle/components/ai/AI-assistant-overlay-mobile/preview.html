<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>AI assistant overlay (mobile) - V27</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  .ds-pane { padding:24px; background:var(--v27-background-primary); color:var(--v27-foreground-primary); }
  .ds-head { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--v27-foreground-secondary); margin:0 0 4px; }
  .ds-meta { font-size:12px; color:var(--v27-foreground-secondary); margin:0 0 18px; }
  .ds-story { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin:0 0 18px; }
  .ds-split { display:grid; grid-template-columns:1fr 1fr; }
</style>
</head>
<body>
<div class="ds-split">
  <div class="ds-pane">
    <p class="ds-head">AI assistant overlay (mobile) - light</p>
    <p class="ds-meta">Figma 7694:96652 &middot; 2 variants &middot; 5 classes</p>
      <div class="ds-story">
        <section class="v27-ai-sheet" aria-label="Assistant">
          <button type="button" class="v27-ai-sheet__header" aria-expanded="true">
            <span class="v27-ai-sheet__handle"></span>
            <span class="v27-ai-sheet__title">
              <svg class="v27-icon v27-icon--large" viewBox="0 0 32 32" aria-hidden="true"></svg>
              Assistant
            </span>
          </button>
        
          <div class="v27-ai-sheet__body">
            <div class="v27-ai-message"> ... </div>
            <div class="v27-user-message"> ... </div>
            <div class="v27-message-box"> ... </div>
          </div>
        </section>
      </div>
  </div>
  <div class="ds-pane" data-v27-theme="dark">
    <p class="ds-head">dark</p>
    <p class="ds-meta">&nbsp;</p>
      <div class="ds-story">
        <section class="v27-ai-sheet" aria-label="Assistant">
          <button type="button" class="v27-ai-sheet__header" aria-expanded="true">
            <span class="v27-ai-sheet__handle"></span>
            <span class="v27-ai-sheet__title">
              <svg class="v27-icon v27-icon--large" viewBox="0 0 32 32" aria-hidden="true"></svg>
              Assistant
            </span>
          </button>
        
          <div class="v27-ai-sheet__body">
            <div class="v27-ai-message"> ... </div>
            <div class="v27-user-message"> ... </div>
            <div class="v27-message-box"> ... </div>
          </div>
        </section>
      </div>
  </div>
</div>
</body></html>
