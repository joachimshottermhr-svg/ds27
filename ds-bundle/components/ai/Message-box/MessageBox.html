<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Message box - V27</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  .ds-pane { padding:24px; background:var(--v27-background-primary); color:var(--v27-foreground-primary); }
  .ds-head { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--v27-foreground-secondary); margin:0 0 4px; }
  .ds-meta { font-size:12px; color:var(--v27-foreground-secondary); margin:0 0 18px; }
  .ds-story { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin:0 0 18px; }
  .ds-split { display:grid; grid-template-columns:1fr 1fr; }
</style>
</head>
<body>
<div class="ds-split">
  <div class="ds-pane">
    <p class="ds-head">Message box - light</p>
    <p class="ds-meta">Figma 7694:90192 &middot; 2 variants &middot; 3 classes</p>
      <div class="ds-story">
        <div class="v27-message-box">
          <div class="v27-message-box__suggestions">
            <button type="button" class="v27-btn v27-btn--small">Suggestion</button>
            <button type="button" class="v27-btn v27-btn--small v27-btn--icon-only" aria-label="More">
              <svg viewBox="0 0 20 20" aria-hidden="true"></svg>
            </button>
          </div>
        
          <div class="v27-chat-input">
            <textarea class="v27-chat-input__field" rows="1" placeholder="Ask People First..."></textarea>
            <div class="v27-chat-input__toolbar">
              <div class="v27-chat-input__tools">
                <button type="button" class="v27-chat-input__tool" aria-label="Attach a file">
                  <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
                </button>
                <button type="button" class="v27-chat-input__tool" aria-label="Dictate">
                  <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
                </button>
              </div>
              <button type="button" class="v27-btn v27-btn--positive v27-btn--icon-only" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
              </button>
            </div>
          </div>
        
          <nav class="v27-message-box__footer">
            <a href="/terms">Terms</a>
            <a href="/privacy">Privacy</a>
            <a href="/feedback">Feedback</a>
          </nav>
        </div>
      </div>
  </div>
  <div class="ds-pane" data-v27-theme="dark">
    <p class="ds-head">dark</p>
    <p class="ds-meta">&nbsp;</p>
      <div class="ds-story">
        <div class="v27-message-box">
          <div class="v27-message-box__suggestions">
            <button type="button" class="v27-btn v27-btn--small">Suggestion</button>
            <button type="button" class="v27-btn v27-btn--small v27-btn--icon-only" aria-label="More">
              <svg viewBox="0 0 20 20" aria-hidden="true"></svg>
            </button>
          </div>
        
          <div class="v27-chat-input">
            <textarea class="v27-chat-input__field" rows="1" placeholder="Ask People First..."></textarea>
            <div class="v27-chat-input__toolbar">
              <div class="v27-chat-input__tools">
                <button type="button" class="v27-chat-input__tool" aria-label="Attach a file">
                  <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
                </button>
                <button type="button" class="v27-chat-input__tool" aria-label="Dictate">
                  <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
                </button>
              </div>
              <button type="button" class="v27-btn v27-btn--positive v27-btn--icon-only" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
              </button>
            </div>
          </div>
        
          <nav class="v27-message-box__footer">
            <a href="/terms">Terms</a>
            <a href="/privacy">Privacy</a>
            <a href="/feedback">Feedback</a>
          </nav>
        </div>
      </div>
  </div>
</div>
</body></html>
