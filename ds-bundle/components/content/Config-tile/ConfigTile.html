<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Config tile - V27</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  .ds-pane { padding:24px; background:var(--v27-background-primary); color:var(--v27-foreground-primary); }
  .ds-head { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--v27-foreground-secondary); margin:0 0 4px; }
  .ds-meta { font-size:12px; color:var(--v27-foreground-secondary); margin:0 0 18px; }
  .ds-story { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin:0 0 18px; }
  .ds-split { display:grid; grid-template-columns:1fr 1fr; }
</style>
</head>
<body>
<div class="ds-split">
  <div class="ds-pane">
    <p class="ds-head">Config tile - light</p>
    <p class="ds-meta">Figma 4338:67656 &middot; 2 variants &middot; 5 classes</p>
      <div class="ds-story">
        <button type="button" class="v27-config-tile">
          <span class="v27-config-tile__disc">
            <svg viewBox="0 0 40 40" aria-hidden="true"><!-- glyph --></svg>
          </span>
          <span class="v27-config-tile__text">
            <span class="v27-config-tile__heading">Heading of tile</span>
            <span class="v27-config-tile__sub">Sub text with more information goes here</span>
          </span>
        </button>
      </div>
  </div>
  <div class="ds-pane" data-v27-theme="dark">
    <p class="ds-head">dark</p>
    <p class="ds-meta">&nbsp;</p>
      <div class="ds-story">
        <button type="button" class="v27-config-tile">
          <span class="v27-config-tile__disc">
            <svg viewBox="0 0 40 40" aria-hidden="true"><!-- glyph --></svg>
          </span>
          <span class="v27-config-tile__text">
            <span class="v27-config-tile__heading">Heading of tile</span>
            <span class="v27-config-tile__sub">Sub text with more information goes here</span>
          </span>
        </button>
      </div>
  </div>
</div>
</body></html>
