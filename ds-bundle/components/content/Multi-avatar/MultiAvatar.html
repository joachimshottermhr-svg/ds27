<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Multi avatar - V27</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  .ds-pane { padding:24px; background:var(--v27-background-primary); color:var(--v27-foreground-primary); }
  .ds-head { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--v27-foreground-secondary); margin:0 0 4px; }
  .ds-meta { font-size:12px; color:var(--v27-foreground-secondary); margin:0 0 18px; }
  .ds-story { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin:0 0 18px; }
  .ds-split { display:grid; grid-template-columns:1fr 1fr; }
</style>
</head>
<body>
<div class="ds-split">
  <div class="ds-pane">
    <p class="ds-head">Multi avatar - light</p>
    <p class="ds-meta">Figma 2299:83865 &middot; 2 variants &middot; 3 classes</p>
      <div class="ds-story">
        <div class="v27-multi-avatar">
          <span class="v27-multi-avatar__item"><img src="/p1.jpg" alt="Jane Smith" /></span>
          <span class="v27-multi-avatar__item"><img src="/p2.jpg" alt="Kianna Herwitz" /></span>
          <span class="v27-multi-avatar__item"><img src="/p3.jpg" alt="Unten Wilson" /></span>
          <span class="v27-multi-avatar__more">+1</span>
        </div>
      </div>
  </div>
  <div class="ds-pane" data-v27-theme="dark">
    <p class="ds-head">dark</p>
    <p class="ds-meta">&nbsp;</p>
      <div class="ds-story">
        <div class="v27-multi-avatar">
          <span class="v27-multi-avatar__item"><img src="/p1.jpg" alt="Jane Smith" /></span>
          <span class="v27-multi-avatar__item"><img src="/p2.jpg" alt="Kianna Herwitz" /></span>
          <span class="v27-multi-avatar__item"><img src="/p3.jpg" alt="Unten Wilson" /></span>
          <span class="v27-multi-avatar__more">+1</span>
        </div>
      </div>
  </div>
</div>
</body></html>
