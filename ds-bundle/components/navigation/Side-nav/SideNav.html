<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Side nav - V27</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  .ds-pane { padding:24px; background:var(--v27-background-primary); color:var(--v27-foreground-primary); }
  .ds-head { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--v27-foreground-secondary); margin:0 0 4px; }
  .ds-meta { font-size:12px; color:var(--v27-foreground-secondary); margin:0 0 18px; }
  .ds-story { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin:0 0 18px; }
  .ds-split { display:grid; grid-template-columns:1fr 1fr; }
</style>
</head>
<body>
<div class="ds-split">
  <div class="ds-pane">
    <p class="ds-head">Side nav - light</p>
    <p class="ds-meta">Figma 1997:40985 &middot; 4 classes</p>
      <div class="ds-story">
        <nav class="v27-side-nav" aria-label="Main">
          <div class="v27-side-nav__items">
            <button type="button" class="v27-nav-item" aria-current="page" aria-label="Home">
              <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
            <button type="button" class="v27-nav-item" aria-label="Inbox">
              <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
            <hr class="v27-side-nav__separator" />
            <button type="button" class="v27-nav-item" aria-label="Payroll">
              <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
          </div>
          <span class="v27-side-nav__avatar"><img src="/me.jpg" alt="Your profile" /></span>
        </nav>
      </div>
  </div>
  <div class="ds-pane" data-v27-theme="dark">
    <p class="ds-head">dark</p>
    <p class="ds-meta">&nbsp;</p>
      <div class="ds-story">
        <nav class="v27-side-nav" aria-label="Main">
          <div class="v27-side-nav__items">
            <button type="button" class="v27-nav-item" aria-current="page" aria-label="Home">
              <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
            <button type="button" class="v27-nav-item" aria-label="Inbox">
              <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
            <hr class="v27-side-nav__separator" />
            <button type="button" class="v27-nav-item" aria-label="Payroll">
              <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
            </button>
          </div>
          <span class="v27-side-nav__avatar"><img src="/me.jpg" alt="Your profile" /></span>
        </nav>
      </div>
  </div>
</div>
</body></html>
