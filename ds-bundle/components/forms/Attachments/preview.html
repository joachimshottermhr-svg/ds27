<!-- @dsCard group="Forms" viewport="900x450" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Attachments - V27</title>
<link rel="stylesheet" href="../../../tokens.css">
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; }
  .ds-pane { padding:24px; background:var(--v27-background-primary); color:var(--v27-foreground-primary); }
  .ds-head { font-size:11px; text-transform:uppercase; letter-spacing:.09em;
             color:var(--v27-foreground-secondary); margin:0 0 4px; }
  .ds-meta { font-size:12px; color:var(--v27-foreground-secondary); margin:0 0 18px; }
  .ds-story { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin:0 0 18px; }
  .ds-split { display:grid; grid-template-columns:1fr 1fr; }
</style>
</head>
<body>
<div class="ds-split">
  <div class="ds-pane">
    <p class="ds-head">Attachments - light</p>
    <p class="ds-meta">Figma 7179:66634 &middot; 2 variants &middot; 7 classes</p>
      <div class="ds-story">
        <div class="v27-attachments">
          <div class="v27-attachments__field">
            <div class="v27-attachments__labels">
              <label class="v27-field__label v27-field__required" for="files">Attachment</label>
              <span class="v27-attachments__hint">Allowed types: svg, png. Max size: 5 MB. Max files: 3</span>
            </div>
            <div class="v27-attachments__dropzone">
              <div class="v27-attachments__actions">
                <button type="button" class="v27-btn v27-btn--outline">
                  <svg class="v27-icon v27-icon--small" viewBox="0 0 20 20" aria-hidden="true"></svg>
                  Browse files
                </button>
              </div>
              <span class="v27-attachments__prompt">Drag and drop files here to upload</span>
            </div>
          </div>
          <button type="button" class="v27-btn v27-btn--positive" disabled>Upload</button>
        </div>
      </div>
  </div>
  <div class="ds-pane" data-v27-theme="dark">
    <p class="ds-head">dark</p>
    <p class="ds-meta">&nbsp;</p>
      <div class="ds-story">
        <div class="v27-attachments">
          <div class="v27-attachments__field">
            <div class="v27-attachments__labels">
              <label class="v27-field__label v27-field__required" for="files">Attachment</label>
              <span class="v27-attachments__hint">Allowed types: svg, png. Max size: 5 MB. Max files: 3</span>
            </div>
            <div class="v27-attachments__dropzone">
              <div class="v27-attachments__actions">
                <button type="button" class="v27-btn v27-btn--outline">
                  <svg class="v27-icon v27-icon--small" viewBox="0 0 20 20" aria-hidden="true"></svg>
                  Browse files
                </button>
              </div>
              <span class="v27-attachments__prompt">Drag and drop files here to upload</span>
            </div>
          </div>
          <button type="button" class="v27-btn v27-btn--positive" disabled>Upload</button>
        </div>
      </div>
  </div>
</div>
</body></html>
